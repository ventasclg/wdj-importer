name: WDJ News Import

on:
  schedule:
    - cron: '0 7 * * *'   # täglich 07:00 UTC = 09:00 MESZ
  workflow_dispatch:        # manuell auslösbar über GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # damit der Job wdj_seen.json committen darf

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Importer ausführen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python wdj_news_import.py

      - name: wdj_seen.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wdj_seen.json
          git diff --staged --quiet || git commit -m "chore: update wdj_seen.json [skip ci]"
          git push
